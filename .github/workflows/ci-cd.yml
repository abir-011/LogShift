name: LogShift CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test-and-push:
    name: Test and Push Docker Image
    runs-on: ubuntu-latest

    # Only push images for commits on main, never for pull requests.
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: logshift
          POSTGRES_USER: logshift_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U logshift_user -d logshift"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_NAME: logshift
      DB_USER: logshift_user
      DB_PASSWORD: test_password
      DB_HOST: localhost
      DB_PORT: 5432

      AWS_REGION: ap-southeast-2
      ECR_REPOSITORY: logshift

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run Django tests
        working-directory: app
        run: python manage.py test

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      - name: Build and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $REGISTRY/$ECR_REPOSITORY:latest .

          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$ECR_REPOSITORY:latest


      - name: Deploy to EC2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_SECURITY_GROUP_ID: ${{ secrets.EC2_SECURITY_GROUP_ID }}
          AWS_REGION: ap-southeast-2
        run: |
          set -Eeuo pipefail

          echo "Checking EC2 instance state..."

          INSTANCE_STATE=$(aws ec2 describe-instances \
            --instance-ids "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)

          if [[ "$INSTANCE_STATE" != "running" ]]; then
            echo "ERROR: EC2 instance is not running. Current state: $INSTANCE_STATE"
            exit 1
          fi

          echo "Discovering current EC2 public IP..."

          EC2_HOST=$(aws ec2 describe-instances \
            --instance-ids "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)

          if [[ -z "$EC2_HOST" || "$EC2_HOST" == "None" ]]; then
            echo "ERROR: EC2 instance has no public IP."
            exit 1
          fi

          echo "EC2 public IP discovered successfully: $EC2_HOST"

          RUNNER_IP=$(curl -fsS https://checkip.amazonaws.com | tr -d '\n')
          RUNNER_CIDR="${RUNNER_IP}/32"

          cleanup() {
            echo "Removing temporary SSH access..."
            aws ec2 revoke-security-group-ingress \
              --group-id "$EC2_SECURITY_GROUP_ID" \
              --protocol tcp \
              --port 22 \
              --cidr "$RUNNER_CIDR" \
              --region "$AWS_REGION" || true
          }
          trap cleanup EXIT

          echo "Temporarily allowing SSH from GitHub runner: $RUNNER_CIDR"

          aws ec2 authorize-security-group-ingress \
            --group-id "$EC2_SECURITY_GROUP_ID" \
            --protocol tcp \
            --port 22 \
            --cidr "$RUNNER_CIDR" \
            --region "$AWS_REGION"

          mkdir -p ~/.ssh
          echo "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/logshift_deploy
          chmod 600 ~/.ssh/logshift_deploy

          ssh -o StrictHostKeyChecking=accept-new \
            -i ~/.ssh/logshift_deploy \
            ubuntu@"$EC2_HOST" \
            'cd /home/ubuntu/LogShift && /bin/bash scripts/deploy.sh'
