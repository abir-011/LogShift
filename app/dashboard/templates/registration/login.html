<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | LogShift</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b1120;
            color: #e5e7eb;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 36px;
            background: #151e30;
            border: 1px solid #263449;
            border-radius: 12px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .subtitle {
            margin: 0 0 28px;
            color: #94a3b8;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #334155;
            border-radius: 6px;
            background: #0b1120;
            color: #fff;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #38bdf8;
            border-color: transparent;
        }

        button {
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 6px;
            background: #0ea5e9;
            color: #fff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0284c7;
        }

        .error {
            margin-bottom: 18px;
            color: #f87171;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <main class="login-card">
        <h1>LogShift</h1>
        <p class="subtitle">Observe. Investigate. Resolve.</p>

        {% if form.errors %}
            <p class="error">
                Invalid username or password. Please try again.
            </p>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <label for="id_username">Username</label>
            {{ form.username }}

            <label for="id_password">Password</label>
            {{ form.password }}

            <input type="hidden" name="next" value="{{ next }}">

            <button type="submit">Sign in</button>
        </form>
    </main>
</body>
</html>
